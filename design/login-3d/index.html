<title>Maison Solange</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Jost:wght@300;400;500&display=swap">

<style>
  :root{
    --ink:#F4F1EB;
    --ink-soft:rgba(244,241,235,.55);
    --ink-faint:rgba(244,241,235,.32);
    --line:rgba(244,241,235,.16);
    --field:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#000;color:var(--ink);
    font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    font-weight:300;-webkit-font-smoothing:antialiased;
    overflow:hidden;-webkit-tap-highlight-color:transparent;
  }

  /* maillage 3D plein écran */
  #mesh{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;}
  /* dégradés d'ambiance pour la profondeur et la lisibilité */
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 38%, rgba(0,0,0,0) 34%, rgba(0,0,0,.72) 100%),
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 62%, rgba(0,0,0,.85) 100%);
  }

  .content{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:clamp(30px,6vh,60px);
    padding:8vh 24px;text-align:center;pointer-events:none;}
  .content > *{pointer-events:auto;}

  /* logo Solange — image officielle, intégrée telle quelle */
  .logo-wrap{position:relative;width:clamp(150px,22vw,196px);aspect-ratio:1;
    display:grid;place-items:center;}
  .logo-glow{position:absolute;inset:-24%;border-radius:50%;
    background:radial-gradient(circle at 50% 48%, rgba(244,241,235,.17), rgba(244,241,235,0) 64%);
    filter:blur(9px);}
  .logo-img{position:relative;width:100%;height:100%;object-fit:contain;display:block;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.7));}

  .brand{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .wordmark{font-size:.8rem;letter-spacing:.58em;text-transform:uppercase;font-weight:400;
    margin:0;padding-left:.58em;color:var(--ink);}
  .tagline{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
    font-size:1.14rem;line-height:1.45;color:var(--ink-soft);margin:0;max-width:24ch;}

  form{width:100%;max-width:322px;display:flex;flex-direction:column;gap:11px;}
  .field{width:100%;background:var(--field);border:1px solid var(--line);border-radius:2px;
    color:var(--ink);font-family:inherit;font-weight:300;font-size:.94rem;letter-spacing:.03em;
    padding:15px 18px;text-align:center;outline:none;backdrop-filter:blur(6px);
    transition:border-color .35s ease,background .35s ease;}
  .field::placeholder{color:var(--ink-faint);}
  .field:focus{border-color:rgba(244,241,235,.46);background:rgba(255,255,255,.08);}
  .submit{width:100%;background:var(--ink);color:#0a0a0a;border:0;border-radius:2px;
    font-family:inherit;font-weight:500;font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;
    padding:16px 18px;cursor:pointer;transition:opacity .3s ease,transform .2s ease;}
  .submit:hover{opacity:.9;} .submit:active{transform:translateY(1px);}
  .note{font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
  :focus-visible{outline:1px solid rgba(244,241,235,.6);outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){ .logo-wrap{transition:none;} }
</style>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('mesh');
  var ctx = cv.getContext('2d');
  var logo = document.getElementById('logo');

  var W=0, H=0, DPR=1;
  var COLS=0, ROWS=0;

  // pointeur (lissé)
  var pt = {x:0, y:0, tx:0, ty:0};

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
    // densité adaptée à l'écran (perf mobile)
    var base = Math.min(W, 900);
    COLS = Math.round(38 + base/26);   // ~ 52 desktop, moins sur mobile
    ROWS = Math.round(26 + base/34);   // ~ 40 desktop
  }
  resize();
  window.addEventListener('resize', resize);

  // hauteur du champ (somme d'ondes → surface organique)
  function field(x, z, t){
    var h = 0;
    h += Math.sin(x*0.62 + t*0.55) * 0.62;
    h += Math.sin(z*0.54 - t*0.42) * 0.60;
    h += Math.sin((x+z)*0.40 + t*0.70) * 0.42;
    h += Math.sin((x*0.30 - z*0.52) - t*0.32) * 0.50;
    h += Math.sin((x*0.9 + z*0.7) + t*0.9) * 0.16;
    return h;
  }

  var SP = 0.62;      // pas de grille (unités monde)
  var AMP = 0.92;     // amplitude verticale
  var FOCAL = 3.15;   // perspective
  var CAMZ = 5.6;     // recul caméra

  function project(x, y, z, cosP, sinP, cosY, sinY, cx, cy, unit){
    // yaw (Y)
    var x1 = x*cosY - z*sinY;
    var z1 = x*sinY + z*cosY;
    // pitch (X) — on incline le plan pour voir la surface fuir
    var y2 = y*cosP - z1*sinP;
    var z2 = y*sinP + z1*cosP;
    var denom = z2 + CAMZ;
    if(denom < 0.2) denom = 0.2;
    var s = FOCAL / denom * unit;
    return { sx: cx + x1*s, sy: cy - y2*s, d: denom, s: s };
  }

  var t0 = performance.now();
  var pts = null; // buffer réutilisé

  function frame(now){
    var t = reduce ? 6.2 : (now - t0)/1000;

    // lissage pointeur
    pt.x += (pt.tx - pt.x)*0.06;
    pt.y += (pt.ty - pt.y)*0.06;

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);

    var unit = Math.max(W,H)*0.30;
    var cx = W*0.5 + pt.x*W*0.04;
    var cy = H*0.46 + pt.y*H*0.03;

    var pitch = 1.02 + pt.y*0.16;
    var yaw   = pt.x*0.22;
    var cosP=Math.cos(pitch), sinP=Math.sin(pitch);
    var cosY=Math.cos(yaw),  sinY=Math.sin(yaw);

    var cols=COLS, rows=ROWS;
    if(!pts || pts.length !== cols*rows){ pts = new Array(cols*rows); }

    var halfC=(cols-1)/2, halfR=(rows-1)/2;
    var i,j,idx=0;
    for(j=0;j<rows;j++){
      for(i=0;i<cols;i++){
        var x=(i-halfC)*SP;
        var z=(j-halfR)*SP;
        var y=field(x,z,t)*AMP;
        pts[idx++] = project(x,y,z,cosP,sinP,cosY,sinY,cx,cy,unit);
      }
    }

    // atténuation par profondeur → fondu premium vers le noir
    function alpha(d){
      var a = 1.15 - (d - (CAMZ-3.2)) / 7.2;
      if(a<0) a=0; if(a>1) a=1;
      return a;
    }

    ctx.lineWidth = 1;
    // lignes horizontales (le long de X)
    for(j=0;j<rows;j++){
      ctx.beginPath();
      for(i=0;i<cols;i++){
        var p=pts[j*cols+i];
        if(i===0) ctx.moveTo(p.sx,p.sy); else ctx.lineTo(p.sx,p.sy);
      }
      var pm=pts[j*cols+((cols>>1))];
      ctx.strokeStyle='rgba(214,220,232,'+(alpha(pm.d)*0.55).toFixed(3)+')';
      ctx.stroke();
    }
    // lignes verticales (le long de Z)
    for(i=0;i<cols;i++){
      ctx.beginPath();
      for(j=0;j<rows;j++){
        var p=pts[j*cols+i];
        if(j===0) ctx.moveTo(p.sx,p.sy); else ctx.lineTo(p.sx,p.sy);
      }
      var pm2=pts[((rows>>1))*cols+i];
      ctx.strokeStyle='rgba(214,220,232,'+(alpha(pm2.d)*0.55).toFixed(3)+')';
      ctx.stroke();
    }
    // points aux sommets (carrés = rapides)
    for(idx=0;idx<pts.length;idx++){
      var p=pts[idx];
      var a=alpha(p.d);
      if(a<=0.02) continue;
      var r=Math.max(0.6, p.s*0.010);
      ctx.fillStyle='rgba(255,255,255,'+(a*0.9).toFixed(3)+')';
      ctx.fillRect(p.sx-r, p.sy-r, r*2, r*2);
    }

    // le logo reste fixe — seul le fond bouge

    if(!reduce) raf = requestAnimationFrame(frame);
  }

  var raf = requestAnimationFrame(frame);

  // pointeur : souris + tactile, normalisé [-1,1]
  function setPointer(clientX, clientY){
    pt.tx = (clientX / window.innerWidth  - 0.5)*2;
    pt.ty = (clientY / window.innerHeight - 0.5)*2;
    if(reduce){ // un seul rendu réactif
      cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
    }
  }
  window.addEventListener('pointermove', function(e){ setPointer(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener('touchmove', function(e){
    if(e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});

  // dérive douce et autonome quand la souris ne bouge pas (desktop)
  var idle=0;
  setInterval(function(){
    idle++;
    if(idle>40 && !reduce){ // ~ après inactivité
      var s=Date.now()/4200;
      pt.tx = Math.sin(s)*0.5;
      pt.ty = Math.cos(s*0.8)*0.35;
    }
  }, 100);
  window.addEventListener('pointermove', function(){ idle=0; }, {passive:true});
})();
</script>
